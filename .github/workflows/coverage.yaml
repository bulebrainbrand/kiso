name: coverage
on: pull_request
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: setup vp
        uses: voidzero-dev/setup-vp@v1.19.0
      - name: main
        run: vpr coverage
      - name: upload actions
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: .kiso-ci/
          retention-days: 1
